services:
  fihnet:
    build: .
    restart: unless-stopped
    environment:
      - PORT=8765
      - FIHNET_DATA=/data/fihnet-data.json
    volumes:
      - fihnet-data:/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - fihnet

volumes:
  fihnet-data:
  caddy-data:
  caddy-config:
